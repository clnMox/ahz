<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Copier</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        color: #ffffff;
        background-color: rgb(5, 0, 31);
    }

    .domain-list {
        list-style: none;
        padding: 0;
    }

    .domain-list li {
        display: flex;
        align-items: center;
        margin: 5px 0;
        padding: 10px;
        border: 1px solid #ccc;
    }

    .domain-list li:hover {
        font-weight: bold;
        color: #00ffff;
        background-color: #595a00;
    }

    .domain-text {
        flex: 1;
        user-select: none;
        -webkit-user-select: none;
    }

    .copy-icon,
    .link-icon {
        cursor: pointer;
        padding: 5px 10px;
        margin-left: 10px;
        background-color: rgb(25, 0, 255);
        border-radius: 3px;
        user-select: none;
        -webkit-user-select: none;
    }

    .notification {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #ff0303;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        display: none;
        font-weight: bold;
        cursor: pointer;
        z-index: 9999;
    }

    .notification.show {
        display: block;
    }

    .controls {
        margin: 10px 0;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    button {
        padding: 6px 12px;
        cursor: pointer;
        font-weight: bold;
    }

    .counter {
        font-weight: bold;
        color: #00ffcc;
    }
</style>
</head>

<body>

<h1>Copy and Remove Domain</h1>

<div class="controls">

    <input type="file" id="fileInput" accept=".txt">

    <button id="undoBtn">
        ↩ Undo Last
    </button>

    <span class="counter">
        Remaining: <span id="count">0</span>
    </span>

</div>

<ul id="domainList" class="domain-list"></ul>

<div id="notification" class="notification"></div>


<script>

document.addEventListener('DOMContentLoaded', () => {

    const domainList =
        document.getElementById('domainList');

    const fileInput =
        document.getElementById('fileInput');

    const notification =
        document.getElementById('notification');

    const undoBtn =
        document.getElementById('undoBtn');

    const countEl =
        document.getElementById('count');


    const TAB_NAME = 'securitytrails_tab';

    const LONG_PRESS_TIME = 3000;

    let history =
        JSON.parse(localStorage.getItem('history')) || [];

    let pressTimer = null;


    /* =====================================================
       HELPERS
    ===================================================== */

    function updateCount() {

        countEl.textContent =
            domainList.children.length;

    }


    function showNotification(message) {

        notification.textContent = message;

        notification.classList.add('show');

        setTimeout(() => {

            notification.classList.remove('show');

        }, 1200);

    }


    function saveDomains() {

        const domains =
            [...domainList.querySelectorAll('.domain-text')]
                .map(element =>
                    element.textContent.trim()
                );

        localStorage.setItem(
            'domains',
            JSON.stringify(domains)
        );

        updateCount();

    }


    function saveHistory() {

        localStorage.setItem(
            'history',
            JSON.stringify(history)
        );

    }


    function addDomain(domain, toTop = false) {

        const li =
            document.createElement('li');

        const domainText =
            document.createElement('span');

        domainText.className =
            'domain-text';

        domainText.textContent =
            domain;


        const linkIcon =
            document.createElement('span');

        linkIcon.className =
            'link-icon';

        linkIcon.textContent =
            '🔗';


        const copyIcon =
            document.createElement('span');

        copyIcon.className =
            'copy-icon';

        copyIcon.textContent =
            '📋';


        li.appendChild(domainText);

        li.appendChild(linkIcon);

        li.appendChild(copyIcon);


        if (toTop) {

            domainList.prepend(li);

        } else {

            domainList.appendChild(li);

        }

        updateCount();

    }


    function removeFirstDomain(reason) {

        const first =
            domainList.querySelector('li');

        if (!first) {
            return;
        }


        const domain =
            first
                .querySelector('.domain-text')
                .textContent
                .trim();


        history.push(domain);

        saveHistory();


        first.remove();

        saveDomains();


        showNotification(
            `${reason}: ${domain}`
        );

    }


    function copyOnly(domain) {

        navigator.clipboard
            .writeText(domain)

            .then(() => {

                showNotification(
                    `Copied: ${domain}`
                );

            })

            .catch(() => {

                showNotification(
                    'Copy failed'
                );

            });

    }


    /* =====================================================
       LOAD SAVED DOMAINS
    ===================================================== */

    function loadDomains() {

        const stored =
            JSON.parse(
                localStorage.getItem('domains')
            ) || [];


        domainList.innerHTML = '';


        stored.forEach(domain => {

            addDomain(domain);

        });


        updateCount();

    }


    loadDomains();


    /* =====================================================
       FILE UPLOAD
    ===================================================== */

    fileInput.addEventListener(
        'change',
        event => {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const domains =
                        event.target.result
                            .split(/\r?\n/)
                            .map(domain =>
                                domain.trim()
                            )
                            .filter(Boolean);


                    domainList.innerHTML = '';


                    domains.forEach(domain => {

                        addDomain(domain);

                    });


                    saveDomains();

                };


            reader.readAsText(file);

        }
    );


    /* =====================================================
       UNDO
    ===================================================== */

    undoBtn.addEventListener(
        'click',
        () => {

            if (!history.length) {

                showNotification(
                    'Nothing to undo'
                );

                return;
            }


            const domain =
                history.pop();


            saveHistory();


            addDomain(
                domain,
                true
            );


            saveDomains();


            showNotification(
                `Restored: ${domain}`
            );

        }
    );


    /* =====================================================
       LONG PRESS START
       3 SECONDS = COPY ONLY
       DOES NOT REMOVE
    ===================================================== */

    function startLongPress(element) {

        if (
            !element.classList.contains(
                'domain-text'
            )
        ) {
            return;
        }


        const first =
            domainList.querySelector('li');


        /*
         * Only allow long press on the
         * first domain.
         */

        if (
            !first ||
            element.parentNode !== first
        ) {
            return;
        }


        const domain =
            element.textContent.trim();


        clearLongPress();


        pressTimer =
            setTimeout(() => {

                pressTimer = null;


                /*
                 * COPY ONLY
                 *
                 * The domain is NOT removed.
                 */

                copyOnly(domain);

            }, LONG_PRESS_TIME);

    }


    function clearLongPress() {

        if (pressTimer !== null) {

            clearTimeout(
                pressTimer
            );

            pressTimer = null;

        }

    }


    /* =====================================================
       MOUSE LONG PRESS
    ===================================================== */

    domainList.addEventListener(
        'mousedown',
        event => {

            if (event.button !== 0) {
                return;
            }


            startLongPress(
                event.target
            );

        }
    );


    domainList.addEventListener(
        'mouseup',
        () => {

            clearLongPress();

        }
    );


    domainList.addEventListener(
        'mouseleave',
        () => {

            clearLongPress();

        }
    );


    /* =====================================================
       TOUCH LONG PRESS
       IMPORTANT FOR ANDROID
    ===================================================== */

    domainList.addEventListener(
        'touchstart',
        event => {

            startLongPress(
                event.target
            );

        },
        {
            passive: true
        }
    );


    domainList.addEventListener(
        'touchend',
        () => {

            clearLongPress();

        }
    );


    domainList.addEventListener(
        'touchcancel',
        () => {

            clearLongPress();

        }
    );


    /* =====================================================
       CLICK / BUTTON HANDLING
    ===================================================== */

    domainList.addEventListener(
        'mousedown',
        event => {

            const first =
                domainList.querySelector('li');


            if (
                !first ||
                event.target.parentNode !== first
            ) {
                return;
            }


            const domain =
                first
                    .querySelector('.domain-text')
                    .textContent
                    .trim();


            /* ---------------------------------------------
               COPY BUTTON
               LEFT CLICK = COPY + REMOVE
            --------------------------------------------- */

            if (
                event.target.classList.contains(
                    'copy-icon'
                ) &&
                event.button === 0
            ) {

                navigator.clipboard
                    .writeText(domain)

                    .then(() => {

                        removeFirstDomain(
                            'Copied'
                        );

                    })

                    .catch(() => {

                        showNotification(
                            'Copy failed'
                        );

                    });

            }


            /* ---------------------------------------------
               LINK BUTTON
            --------------------------------------------- */

            if (
                event.target.classList.contains(
                    'link-icon'
                )
            ) {

                const url =
                    'https://securitytrails.com/list/ip/' +
                    encodeURIComponent(domain);


                /* -----------------------------------------
                   MIDDLE CLICK
                   OPEN BUT KEEP DOMAIN
                ----------------------------------------- */

                if (event.button === 1) {

                    window.open(
                        url,
                        TAB_NAME
                    );


                    showNotification(
                        `Opened (kept): ${domain}`
                    );


                    return;

                }


                /* -----------------------------------------
                   LEFT CLICK
                   OPEN + REMOVE
                ----------------------------------------- */

                if (event.button === 0) {

                    window.open(
                        url,
                        TAB_NAME
                    );


                    removeFirstDomain(
                        'Opened'
                    );

                }

            }

        }
    );


});

</script>

</body>
</html>
