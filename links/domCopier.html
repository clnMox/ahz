<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Domain Copier</title>


<style>

/* =====================================================
   PAGE
===================================================== */

body {

    font-family: Arial, sans-serif;

    padding: 20px;

    color: #ffffff;

    background-color: rgb(5, 0, 31);

}


/* =====================================================
   DOMAIN LIST
===================================================== */

.domain-list {

    list-style: none;

    padding: 0;

}


.domain-list li {

    display: flex;

    align-items: center;

    margin: 5px 0;

    padding: 10px;

    border: 1px solid #ccc;

}


.domain-list li:hover {

    font-weight: bold;

    color: #00ffff;

    background-color: #595a00;

}


/* =====================================================
   DOMAIN TEXT
===================================================== */

.domain-text {

    flex: 1;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;

}


/* =====================================================
   BUTTONS
===================================================== */

.copy-icon,
.link-icon {

    cursor: pointer;

    padding: 5px 10px;

    margin-left: 10px;

    background-color: rgb(25, 0, 255);

    border-radius: 3px;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;

}


/* =====================================================
   NOTIFICATION
===================================================== */

.notification {

    position: fixed;

    top: 20px;

    left: 50%;

    transform: translateX(-50%);

    background-color: #ff0303;

    color: white;

    padding: 10px 20px;

    border-radius: 5px;

    display: none;

    font-weight: bold;

    z-index: 9999;

    max-width: 90%;

    text-align: center;

}


.notification.show {

    display: block;

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    margin: 10px 0;

    display: flex;

    gap: 10px;

    align-items: center;

    flex-wrap: wrap;

}


button {

    padding: 6px 12px;

    cursor: pointer;

    font-weight: bold;

}


.counter {

    font-weight: bold;

    color: #00ffcc;

}

</style>

</head>


<body>


<h1>Copy and Remove Domain</h1>


<div class="controls">


    <input
        type="file"
        id="fileInput"
        accept=".txt"
    >


    <button id="undoBtn">

        ↩ Undo Last

    </button>


    <span class="counter">

        Remaining:

        <span id="count">0</span>

    </span>


</div>


<ul
    id="domainList"
    class="domain-list">
</ul>


<div
    id="notification"
    class="notification">
</div>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {


        /* =================================================
           ELEMENTS
        ================================================= */

        const domainList =
            document.getElementById(
                'domainList'
            );


        const fileInput =
            document.getElementById(
                'fileInput'
            );


        const undoBtn =
            document.getElementById(
                'undoBtn'
            );


        const countEl =
            document.getElementById(
                'count'
            );


        const notification =
            document.getElementById(
                'notification'
            );


        /* =================================================
           SETTINGS
        ================================================= */

        const TAB_NAME =
            'securitytrails_tab';


        /*
         * Long press duration.
         *
         * 1000 milliseconds = 1 second
         */

        const LONG_PRESS =
            1000;


        /* =================================================
           VARIABLES
        ================================================= */

        let history =
            JSON.parse(
                localStorage.getItem(
                    'history'
                ) || '[]'
            );


        let longPressTimer = null;

        let longPressCompleted = false;


        /* =================================================
           COUNT
        ================================================= */

        function updateCount() {

            countEl.textContent =
                domainList.children.length;

        }


        /* =================================================
           NOTIFICATION
        ================================================= */

        function showNotification(
            message
        ) {

            notification.textContent =
                message;


            notification.classList.add(
                'show'
            );


            setTimeout(
                function () {

                    notification.classList.remove(
                        'show'
                    );

                },
                1500
            );

        }


        /* =================================================
           SAVE DOMAINS
        ================================================= */

        function saveDomains() {

            const domains =
                Array.from(
                    domainList.querySelectorAll(
                        '.domain-text'
                    )
                ).map(
                    function (element) {

                        return element.textContent.trim();

                    }
                );


            localStorage.setItem(
                'domains',
                JSON.stringify(domains)
            );


            updateCount();

        }


        /* =================================================
           SAVE HISTORY
        ================================================= */

        function saveHistory() {

            localStorage.setItem(
                'history',
                JSON.stringify(history)
            );

        }


        /* =================================================
           ADD DOMAIN
        ================================================= */

        function addDomain(
            domain,
            toTop = false
        ) {

            const li =
                document.createElement(
                    'li'
                );


            /* DOMAIN */

            const domainText =
                document.createElement(
                    'span'
                );


            domainText.className =
                'domain-text';


            domainText.textContent =
                domain;


            /* LINK */

            const linkIcon =
                document.createElement(
                    'span'
                );


            linkIcon.className =
                'link-icon';


            linkIcon.textContent =
                '🔗';


            /* COPY */

            const copyIcon =
                document.createElement(
                    'span'
                );


            copyIcon.className =
                'copy-icon';


            copyIcon.textContent =
                '📋';


            /* BUILD ROW */

            li.appendChild(
                domainText
            );


            li.appendChild(
                linkIcon
            );


            li.appendChild(
                copyIcon
            );


            /* INSERT */

            if (toTop) {

                domainList.prepend(
                    li
                );

            } else {

                domainList.appendChild(
                    li
                );

            }


            updateCount();

        }


        /* =================================================
           REMOVE DOMAIN
        ================================================= */

        function removeDomain(
            li,
            reason
        ) {

            if (!li) {
                return;
            }


            const domain =
                li.querySelector(
                    '.domain-text'
                ).textContent.trim();


            /*
             * Save for Undo.
             */

            history.push(
                domain
            );


            saveHistory();


            /*
             * Remove.
             */

            li.remove();


            saveDomains();


            showNotification(
                reason + ': ' + domain
            );

        }


        /* =================================================
           MODERN COPY
        ================================================= */

        async function copyText(
            text
        ) {


            /*
             * Try modern Clipboard API.
             */

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );


                    showNotification(
                        'Copied: ' + text
                    );


                    return true;

                }

            }

            catch (error) {

                console.log(
                    'Clipboard API failed:',
                    error
                );

            }


            /*
             * Try fallback.
             */

            return fallbackCopy(
                text
            );

        }


        /* =================================================
           FALLBACK COPY
        ================================================= */

        function fallbackCopy(
            text
        ) {

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value =
                text;


            textarea.setAttribute(
                'readonly',
                ''
            );


            textarea.style.position =
                'fixed';


            textarea.style.left =
                '-9999px';


            textarea.style.top =
                '0';


            textarea.style.width =
                '1px';


            textarea.style.height =
                '1px';


            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.focus();


            textarea.select();


            textarea.setSelectionRange(
                0,
                textarea.value.length
            );


            let success =
                false;


            try {

                success =
                    document.execCommand(
                        'copy'
                    );

            }

            catch (error) {

                console.log(
                    'Fallback copy failed:',
                    error
                );

            }


            textarea.remove();


            if (success) {

                showNotification(
                    'Copied: ' + text
                );


                return true;

            }


            showNotification(
                'Copy failed'
            );


            return false;

        }


        /* =================================================
           LOAD SAVED DOMAINS
        ================================================= */

        function loadDomains() {

            const domains =
                JSON.parse(
                    localStorage.getItem(
                        'domains'
                    ) || '[]'
                );


            domainList.innerHTML =
                '';


            domains.forEach(
                function (domain) {

                    addDomain(
                        domain
                    );

                }
            );


            updateCount();

        }


        loadDomains();


        /* =================================================
           FILE UPLOAD
        ================================================= */

        fileInput.addEventListener(
            'change',
            function (event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {


                        const domains =
                            event.target.result

                                .split(/\r?\n/)

                                .map(
                                    function (domain) {

                                        return domain.trim();

                                    }
                                )

                                .filter(Boolean);


                        domainList.innerHTML =
                            '';


                        domains.forEach(
                            function (domain) {

                                addDomain(
                                    domain
                                );

                            }
                        );


                        saveDomains();

                    };


                reader.readAsText(
                    file
                );

            }
        );


        /* =================================================
           UNDO
        ================================================= */

        undoBtn.addEventListener(
            'click',
            function () {


                if (!history.length) {

                    showNotification(
                        'Nothing to undo'
                    );

                    return;

                }


                const domain =
                    history.pop();


                saveHistory();


                addDomain(
                    domain,
                    true
                );


                saveDomains();


                showNotification(
                    'Restored: ' + domain
                );

            }
        );


        /* =================================================
           START LONG PRESS
           
           ANY DOMAIN CAN BE LONG PRESSED.
           
           LONG PRESS = COPY ONLY.
           
           NEVER REMOVE.
        ================================================= */

        function startLongPress(
            element
        ) {


            if (
                !element.classList.contains(
                    'domain-text'
                )
            ) {

                return;

            }


            /*
             * Cancel previous timer.
             */

            clearLongPress();


            longPressCompleted =
                false;


            const domain =
                element.textContent.trim();


            /*
             * Start 1-second timer.
             */

            longPressTimer =
                setTimeout(
                    async function () {


                        longPressCompleted =
                            true;


                        longPressTimer =
                            null;


                        /*
                         * COPY ONLY.
                         *
                         * NOTHING IS REMOVED.
                         */

                        await copyText(
                            domain
                        );


                    },
                    LONG_PRESS
                );

        }


        /* =================================================
           CLEAR LONG PRESS
        ================================================= */

        function clearLongPress() {


            if (
                longPressTimer !== null
            ) {

                clearTimeout(
                    longPressTimer
                );


                longPressTimer =
                    null;

            }

        }


        /* =================================================
           TOUCH START
        ================================================= */

        domainList.addEventListener(
            'touchstart',
            function (event) {


                const element =
                    event.target;


                if (
                    element.classList.contains(
                        'domain-text'
                    )
                ) {

                    startLongPress(
                        element
                    );

                }

            },
            {
                passive: true
            }
        );


        /* =================================================
           TOUCH END
        ================================================= */

        domainList.addEventListener(
            'touchend',
            function () {


                if (
                    !longPressCompleted
                ) {

                    clearLongPress();

                }


            }
        );


        /* =================================================
           TOUCH CANCEL
        ================================================= */

        domainList.addEventListener(
            'touchcancel',
            function () {

                clearLongPress();

            }
        );


        /* =================================================
           MOUSE DOWN
        ================================================= */

        domainList.addEventListener(
            'mousedown',
            function (event) {


                if (
                    event.button !== 0
                ) {

                    return;

                }


                const element =
                    event.target;


                if (
                    element.classList.contains(
                        'domain-text'
                    )
                ) {

                    startLongPress(
                        element
                    );

                }

            }
        );


        /* =================================================
           MOUSE UP
        ================================================= */

        domainList.addEventListener(
            'mouseup',
            function () {


                if (
                    !longPressCompleted
                ) {

                    clearLongPress();

                }


            }
        );


        /* =================================================
           COPY BUTTON
           
           ONLY FIRST ITEM CAN REMOVE.
        ================================================= */

        domainList.addEventListener(
            'click',
            function (event) {


                if (
                    !event.target.classList.contains(
                        'copy-icon'
                    )
                ) {

                    return;

                }


                const li =
                    event.target.closest(
                        'li'
                    );


                const first =
                    domainList.querySelector(
                        'li'
                    );


                /*
                 * SAFETY:
                 *
                 * If this is NOT the first item,
                 * DO NOTHING.
                 */

                if (
                    !li ||
                    li !== first
                ) {

                    return;

                }


                const domain =
                    li.querySelector(
                        '.domain-text'
                    ).textContent.trim();


                /*
                 * Copy then remove.
                 */

                copyText(
                    domain
                ).then(
                    function (success) {


                        if (success) {

                            removeDomain(
                                li,
                                'Copied'
                            );

                        }

                    }
                );

            }
        );


        /* =================================================
           LINK BUTTON
        ================================================= */

        domainList.addEventListener(
            'mousedown',
            function (event) {


                if (
                    !event.target.classList.contains(
                        'link-icon'
                    )
                ) {

                    return;

                }


                const li =
                    event.target.closest(
                        'li'
                    );


                if (!li) {
                    return;
                }


                const domain =
                    li.querySelector(
                        '.domain-text'
                    ).textContent.trim();


                const url =
                    'https://securitytrails.com/list/ip/' +
                    encodeURIComponent(
                        domain
                    );


                /* =========================================
                   MIDDLE CLICK
                   
                   ANY ITEM CAN OPEN.
                   
                   NOTHING IS REMOVED.
                ========================================= */

                if (
                    event.button === 1
                ) {

                    window.open(
                        url,
                        TAB_NAME
                    );


                    showNotification(
                        'Opened (kept): ' +
                        domain
                    );


                    return;

                }


                /* =========================================
                   LEFT CLICK
                   
                   ONLY FIRST ITEM CAN REMOVE.
                ========================================= */

                if (
                    event.button === 0
                ) {


                    const first =
                        domainList.querySelector(
                            'li'
                        );


                    /*
                     * SAFETY CHECK.
                     *
                     * Not first = do nothing.
                     */

                    if (
                        li !== first
                    ) {

                        return;

                    }


                    window.open(
                        url,
                        TAB_NAME
                    );


                    removeDomain(
                        li,
                        'Opened'
                    );

                }

            }
        );


    }
);

</script>

</body>

</html>
