<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Domain Copier</title>

<style>

body {
    font-family: Arial, sans-serif;
    padding: 20px;
    color: #ffffff;
    background-color: rgb(5, 0, 31);
}

.domain-list {
    list-style: none;
    padding: 0;
}

.domain-list li {
    display: flex;
    align-items: center;
    margin: 5px 0;
    padding: 10px;
    border: 1px solid #ccc;
}

.domain-list li:hover {
    font-weight: bold;
    color: #00ffff;
    background-color: #595a00;
}

.domain-text {
    flex: 1;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

    touch-action: manipulation;
}

.copy-icon,
.link-icon {
    cursor: pointer;

    padding: 5px 10px;

    margin-left: 10px;

    background-color: rgb(25, 0, 255);

    border-radius: 3px;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.notification {
    position: fixed;

    top: 20px;

    left: 50%;

    transform: translateX(-50%);

    background-color: #ff0303;

    color: white;

    padding: 10px 20px;

    border-radius: 5px;

    display: none;

    font-weight: bold;

    z-index: 9999;

    max-width: 90%;

    text-align: center;
}

.notification.show {
    display: block;
}

.controls {
    margin: 10px 0;

    display: flex;

    gap: 10px;

    align-items: center;

    flex-wrap: wrap;
}

button {
    padding: 6px 12px;

    cursor: pointer;

    font-weight: bold;
}

.counter {
    font-weight: bold;

    color: #00ffcc;
}

</style>
</head>


<body>

<h1>Copy and Remove Domain</h1>


<div class="controls">

    <input
        type="file"
        id="fileInput"
        accept=".txt"
    >

    <button id="undoBtn">
        ↩ Undo Last
    </button>

    <span class="counter">
        Remaining:
        <span id="count">0</span>
    </span>

</div>


<ul
    id="domainList"
    class="domain-list"
></ul>


<div
    id="notification"
    class="notification"
></div>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const domainList =
            document.getElementById(
                'domainList'
            );

        const fileInput =
            document.getElementById(
                'fileInput'
            );

        const undoBtn =
            document.getElementById(
                'undoBtn'
            );

        const countEl =
            document.getElementById(
                'count'
            );

        const notification =
            document.getElementById(
                'notification'
            );


        const TAB_NAME =
            'securitytrails_tab';


        const LONG_PRESS =
            1000;


        let history =
            JSON.parse(
                localStorage.getItem(
                    'history'
                ) || '[]'
            );


        let timer = null;

        let currentTarget = null;

        let longPress = false;


        /* =================================================
           COUNT
        ================================================= */

        function updateCount() {

            countEl.textContent =
                domainList.children.length;

        }


        /* =================================================
           NOTIFICATION
        ================================================= */

        function showNotification(
            message
        ) {

            notification.textContent =
                message;

            notification.classList.add(
                'show'
            );


            setTimeout(
                function () {

                    notification.classList.remove(
                        'show'
                    );

                },
                1500
            );

        }


        /* =================================================
           SAVE DOMAINS
        ================================================= */

        function saveDomains() {

            const domains =
                Array.from(
                    domainList.querySelectorAll(
                        '.domain-text'
                    )
                ).map(
                    function (element) {

                        return element.textContent.trim();

                    }
                );


            localStorage.setItem(
                'domains',
                JSON.stringify(domains)
            );


            updateCount();

        }


        /* =================================================
           HISTORY
        ================================================= */

        function saveHistory() {

            localStorage.setItem(
                'history',
                JSON.stringify(history)
            );

        }


        /* =================================================
           ADD DOMAIN
        ================================================= */

        function addDomain(
            domain,
            top = false
        ) {

            const li =
                document.createElement(
                    'li'
                );


            const text =
                document.createElement(
                    'span'
                );

            text.className =
                'domain-text';

            text.textContent =
                domain;


            const link =
                document.createElement(
                    'span'
                );

            link.className =
                'link-icon';

            link.textContent =
                '🔗';


            const copy =
                document.createElement(
                    'span'
                );

            copy.className =
                'copy-icon';

            copy.textContent =
                '📋';


            li.appendChild(text);

            li.appendChild(link);

            li.appendChild(copy);


            if (top) {

                domainList.prepend(li);

            } else {

                domainList.appendChild(li);

            }


            updateCount();

        }


        /* =================================================
           REMOVE DOMAIN
        ================================================= */

        function removeDomain(
            li,
            reason
        ) {

            if (!li) {
                return;
            }


            const domain =
                li.querySelector(
                    '.domain-text'
                ).textContent.trim();


            history.push(domain);

            saveHistory();


            li.remove();

            saveDomains();


            showNotification(
                reason + ': ' + domain
            );

        }


        /* =================================================
           COPY
           
           HTTPS/GITHUB PAGES FIRST
        ================================================= */

        async function copyText(
            text
        ) {

            /*
             * Modern clipboard.
             */

            try {

                if (
                    navigator.clipboard
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );


                    showNotification(
                        'Copied: ' + text
                    );


                    return true;

                }

            } catch (error) {

                console.log(
                    'Clipboard API failed:',
                    error
                );

            }


            /*
             * Fallback.
             */

            return fallbackCopy(
                text
            );

        }


        /* =================================================
           FALLBACK COPY
        ================================================= */

        function fallbackCopy(
            text
        ) {

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value =
                text;


            textarea.style.position =
                'fixed';

            textarea.style.left =
                '-9999px';

            textarea.style.top =
                '0';

            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.focus();

            textarea.select();

            textarea.setSelectionRange(
                0,
                textarea.value.length
            );


            let result = false;


            try {

                result =
                    document.execCommand(
                        'copy'
                    );

            } catch (error) {

                console.log(
                    error
                );

            }


            textarea.remove();


            if (result) {

                showNotification(
                    'Copied: ' + text
                );

                return true;

            }


            showNotification(
                'Copy failed'
            );


            return false;

        }


        /* =================================================
           LOAD
        ================================================= */

        function loadDomains() {

            const domains =
                JSON.parse(
                    localStorage.getItem(
                        'domains'
                    ) || '[]'
                );


            domainList.innerHTML =
                '';


            domains.forEach(
                function (domain) {

                    addDomain(
                        domain
                    );

                }
            );


            updateCount();

        }


        loadDomains();


        /* =================================================
           FILE
        ================================================= */

        fileInput.addEventListener(
            'change',
            function (event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        const domains =
                            event.target.result
                                .split(/\r?\n/)
                                .map(
                                    function (d) {

                                        return d.trim();

                                    }
                                )
                                .filter(Boolean);


                        domainList.innerHTML =
                            '';


                        domains.forEach(
                            function (domain) {

                                addDomain(
                                    domain
                                );

                            }
                        );


                        saveDomains();

                    };


                reader.readAsText(
                    file
                );

            }
        );


        /* =================================================
           UNDO
        ================================================= */

        undoBtn.addEventListener(
            'click',
            function () {

                if (!history.length) {

                    showNotification(
                        'Nothing to undo'
                    );

                    return;
                }


                const domain =
                    history.pop();


                saveHistory();


                addDomain(
                    domain,
                    true
                );


                saveDomains();


                showNotification(
                    'Restored: ' + domain
                );

            }
        );


        /* =================================================
           START LONG PRESS
        ================================================= */

        function startLongPress(
            element
        ) {

            if (
                !element.classList.contains(
                    'domain-text'
                )
            ) {

                return;

            }


            clearTimer();


            currentTarget =
                element;


            longPress =
                false;


            const domain =
                element.textContent.trim();


            timer =
                setTimeout(
                    function () {

                        longPress =
                            true;


                        timer =
                            null;


                        /*
                         * COPY ONLY.
                         *
                         * DOES NOT REMOVE.
                         */

                        copyText(
                            domain
                        );


                    },
                    LONG_PRESS
                );

        }


        /* =================================================
           CLEAR TIMER
        ================================================= */

        function clearTimer() {

            if (
                timer !== null
            ) {

                clearTimeout(
                    timer
                );

                timer =
                    null;

            }

        }


        /* =================================================
           TOUCH START
        ================================================= */

        domainList.addEventListener(
            'touchstart',
            function (event) {

                const element =
                    event.target;


                if (
                    element.classList.contains(
                        'domain-text'
                    )
                ) {

                    startLongPress(
                        element
                    );

                }

            },
            {
                passive: true
            }
        );


        /* =================================================
           TOUCH END
        ================================================= */

        domainList.addEventListener(
            'touchend',
            function () {

                clearTimer();

                currentTarget =
                    null;

            }
        );


        /* =================================================
           TOUCH CANCEL
        ================================================= */

        domainList.addEventListener(
            'touchcancel',
            function () {

                clearTimer();

                currentTarget =
                    null;

            }
        );


        /* =================================================
           MOUSE DOWN
        ================================================= */

        domainList.addEventListener(
            'mousedown',
            function (event) {

                if (
                    event.button !== 0
                ) {

                    return;

                }


                const element =
                    event.target;


                if (
                    element.classList.contains(
                        'domain-text'
                    )
                ) {

                    startLongPress(
                        element
                    );

                }

            }
        );


        /* =================================================
           MOUSE UP
        ================================================= */

        domainList.addEventListener(
            'mouseup',
            function () {

                clearTimer();

                currentTarget =
                    null;

            }
        );


        /* =================================================
           COPY BUTTON
           
           COPY + REMOVE
        ================================================= */

        domainList.addEventListener(
            'click',
            function (event) {

                if (
                    !event.target.classList.contains(
                        'copy-icon'
                    )
                ) {

                    return;

                }


                const li =
                    event.target.parentNode;


                const domain =
                    li.querySelector(
                        '.domain-text'
                    ).textContent.trim();


                copyText(
                    domain
                ).then(
                    function (success) {

                        if (success) {

                            removeDomain(
                                li,
                                'Copied'
                            );

                        }

                    }
                );

            }
        );


        /* =================================================
           LINK
           
           LEFT:
           OPEN + REMOVE
           
           MIDDLE:
           OPEN + KEEP
        ================================================= */

        domainList.addEventListener(
            'mousedown',
            function (event) {

                if (
                    !event.target.classList.contains(
                        'link-icon'
                    )
                ) {

                    return;

                }


                const li =
                    event.target.parentNode;


                const domain =
                    li.querySelector(
                        '.domain-text'
                    ).textContent.trim();


                const url =
                    'https://securitytrails.com/list/ip/' +
                    encodeURIComponent(
                        domain
                    );


                if (
                    event.button === 1
                ) {

                    window.open(
                        url,
                        TAB_NAME
                    );


                    showNotification(
                        'Opened (kept): ' +
                        domain
                    );


                    return;

                }


                if (
                    event.button === 0
                ) {

                    window.open(
                        url,
                        TAB_NAME
                    );


                    removeDomain(
                        li,
                        'Opened'
                    );

                }

            }
        );


    }
);

</script>

</body>
</html>
